name: Android build & APK release
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Install Android SDK
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses >/dev/null || true
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-35" "build-tools;35.0.0"
      - name: Bundle open-source Boshiamy dictionary
        run: |
          mkdir -p app/src/main/assets
          curl --fail --location --retry 3 --connect-timeout 15 --max-time 120 \
            https://raw.githubusercontent.com/jdh8/ibus-boshiamy/master/boshiamy.txt \
            -o /tmp/boshiamy.txt
          python3 - <<'PY'
          from pathlib import Path
          text = Path('/tmp/boshiamy.txt').read_text(encoding='utf-8-sig')
          assert 'BEGIN_TABLE' in text, 'SCIM dictionary table marker missing'
          inside = False
          lines = []
          seen = set()
          for line in text.splitlines():
              if line.strip() == 'BEGIN_TABLE':
                  inside = True
                  continue
              if line.strip() == 'END_TABLE':
                  break
              if not inside or line.startswith('#'):
                  continue
              fields = line.split('\t')
              if len(fields) < 2:
                  continue
              code, word = fields[0].strip(), fields[1].strip()
              if code.isascii() and code.isalpha() and 1 <= len(code) <= 8 and word:
                  pair = code.lower()+'\t'+word
                  if pair not in seen:
                      lines.append(pair)
                      seen.add(pair)
          assert len(lines) > 10000, f'Unexpected dictionary size: {len(lines)}'
          Path('app/src/main/assets/boshiamy.tsv').write_text('\n'.join(lines)+'\n', encoding='utf-8')
          print(f'Bundled {len(lines)} unique mappings')
          PY
      - name: Test input rules
        run: |
          mkdir -p /tmp/boshi-tests
          javac -d /tmp/boshi-tests app/src/main/java/tw/boshi/keyboard/InputRules.java tests/InputRulesTest.java
          java -cp /tmp/boshi-tests tw.boshi.keyboard.InputRulesTest
      - name: Compile
        run: gradle --no-daemon assembleDebug
      - name: Upload single APK to release
        if: github.event_name != 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp app/build/outputs/apk/debug/app-debug.apk Boshi-debug.apk
          if gh release view preview >/dev/null 2>&1; then
            gh release upload preview Boshi-debug.apk --clobber
          else
            gh release create preview Boshi-debug.apk --prerelease --title "Boshi v0.1 preview" --notes "Experimental Android keyboard with TSV import, offline phrase candidates and opt-in Gemini/NVIDIA API. No bundled Boshiamy table."
          fi

