name: Android build & APK release
on:
  push:
    branches: [main]
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Install Android SDK
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses >/dev/null || true
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-35" "build-tools;35.0.0"
      - name: Compile
        run: gradle --no-daemon assembleDebug
      - name: Upload single APK to release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp app/build/outputs/apk/debug/app-debug.apk Boshi-debug.apk
          if gh release view preview >/dev/null 2>&1; then
            gh release upload preview Boshi-debug.apk --clobber
          else
            gh release create preview Boshi-debug.apk --prerelease --title "Boshi v0.1 preview" --notes "Experimental Android keyboard with TSV import, offline phrase candidates and opt-in Gemini/NVIDIA API. No bundled Boshiamy table."
          fi
