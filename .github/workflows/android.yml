name: Android build & APK release
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Install Android SDK
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses >/dev/null || true
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-35" "build-tools;35.0.0"
      - name: Bundle open-source Boshiamy dictionary
        run: |
          mkdir -p app/src/main/assets
          curl --fail --location --retry 3 --connect-timeout 15 --max-time 120 \
            https://raw.githubusercontent.com/jdh8/ibus-boshiamy/master/boshiamy.txt \
            -o /tmp/boshiamy.txt
          python3 - <<'PY'
          from pathlib import Path
          text = Path('/tmp/boshiamy.txt').read_text(encoding='utf-8-sig')
          assert 'BEGIN_TABLE' in text, 'SCIM dictionary table marker missing'
          inside = False
          lines = []
          seen = set()
          for line in text.splitlines():
              if line.strip() == 'BEGIN_TABLE':
                  inside = True
                  continue
              if line.strip() == 'END_TABLE':
                  break
              if not inside or line.startswith('#'):
                  continue
              fields = line.split('\t')
              if len(fields) < 2:
                  continue
              code, word = fields[0].strip(), fields[1].strip()
              if code.isascii() and code.isalpha() and 1 <= len(code) <= 8 and word:
                  pair = code.lower()+'\t'+word
                  if pair not in seen:
                      lines.append(pair)
                      seen.add(pair)
          assert len(lines) > 10000, f'Unexpected dictionary size: {len(lines)}'
          Path('app/src/main/assets/boshiamy.tsv').write_text('\n'.join(lines)+'\n', encoding='utf-8')
          print(f'Bundled {len(lines)} unique mappings')
          PY
      - name: Bundle offline phrase vocabulary
        run: |
          source=https://raw.githubusercontent.com/rime/rime-essay/054920de4f54c9e5994276a96a4fc2a35cb51aa3
          curl --fail --location --retry 3 --connect-timeout 15 --max-time 120 "$source/essay.txt" -o /tmp/rime-essay.txt
          mkdir -p app/src/main/assets/rime-essay
          curl --fail --location --retry 3 "$source/LICENSE" -o app/src/main/assets/rime-essay/LICENSE
          curl --fail --location --retry 3 "$source/AUTHORS" -o app/src/main/assets/rime-essay/AUTHORS
          cp /usr/share/common-licenses/GPL-3 app/src/main/assets/rime-essay/GPL-3
          printf '%s\n' "Source: $source/essay.txt" "Modified: selected and frequency-sorted phrases, preceded by Boshi conversation seeds." > app/src/main/assets/rime-essay/SOURCE.txt
          python3 scripts/build_offline_lexicon.py /tmp/rime-essay.txt app/src/main/assets/offline_phrases.txt
      - name: Test input rules
        run: |
          mkdir -p /tmp/boshi-tests
          javac -d /tmp/boshi-tests app/src/main/java/tw/boshi/keyboard/InputRules.java app/src/main/java/tw/boshi/keyboard/OfflineSuggestions.java tests/InputRulesTest.java tests/OfflineSuggestionsTest.java app/src/main/java/tw/boshi/keyboard/VoiceInputSession.java tests/VoiceInputSessionTest.java app/src/main/java/tw/boshi/keyboard/QuickPhraseBook.java tests/QuickPhraseBookTest.java
          java -cp /tmp/boshi-tests tw.boshi.keyboard.InputRulesTest
          java -cp /tmp/boshi-tests tw.boshi.keyboard.OfflineSuggestionsTest app/src/main/assets/offline_phrases.txt
          java -cp /tmp/boshi-tests tw.boshi.keyboard.VoiceInputSessionTest
          java -cp /tmp/boshi-tests tw.boshi.keyboard.QuickPhraseBookTest
          mkdir -p /tmp/boshi-voice-tests
          javac -d /tmp/boshi-voice-tests $(find tests/voice-stubs -name '*.java') app/src/main/java/tw/boshi/keyboard/VoiceInputSession.java app/src/main/java/tw/boshi/keyboard/VoiceInputController.java tests/VoiceInputControllerTest.java
          java -cp /tmp/boshi-voice-tests tw.boshi.keyboard.VoiceInputControllerTest
          python3 -m unittest discover -s tests -p 'test_*.py' -v
      - name: Compile
        run: gradle --no-daemon assembleDebug
      - name: Upload single APK to release
        if: github.event_name != 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version=$(python3 - <<'PY'
          import re
          from pathlib import Path
          match = re.search(r"versionName\s+'([^']+)'", Path('app/build.gradle').read_text())
          if not match:
              raise SystemExit('versionName missing from app/build.gradle')
          print(match.group(1))
          PY
          )
          title="Boshi v${version} preview"
          printf '%s\n' "Boshi AI Keyboard v${version}" \
            "" "Includes the offline Boshiamy dictionary, bundled Rime phrase continuations, and optional Gemini/NVIDIA AI assistance." \
            "Chinese S + period outputs ？; the period key outputs ASCII ." \
            "1–5 Chinese characters use local candidates; AI assistance starts at 6 characters." \
            "Includes offline next-word candidates on fresh installs, including after 有 and 我是有." \
            "Includes a keyboard microphone button: speech becomes editable text, without an audio attachment or automatic sending." \
            "v0.9.1 fixes repeated shortcut codes: one code lists multiple independently editable phrases; existing dictionaries remain readable." \
            "" "Build source: https://github.com/${GITHUB_REPOSITORY}/commit/${GITHUB_SHA}" \
            > /tmp/boshi-release-notes.txt
          cp app/build/outputs/apk/debug/app-debug.apk Boshi-debug.apk
          if gh release view preview >/dev/null 2>&1; then
            gh release upload preview Boshi-debug.apk --clobber
            gh release edit preview --title "$title" --notes-file /tmp/boshi-release-notes.txt
          else
            gh release create preview Boshi-debug.apk --prerelease --title "$title" --notes-file /tmp/boshi-release-notes.txt
          fi

